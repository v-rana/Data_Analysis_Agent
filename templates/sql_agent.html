<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', path='sql-agent/styles.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="toolbar">
        <label>
          Access Mode
          <select id="sessionMode">
            <option value="personal">Guest</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <label id="secretKeyWrap" style="display: none;">
          Secret Key
          <input id="secretKeyInput" type="password" placeholder="Enter admin secret" />
        </label>
        <button id="sessionBtn" type="button">Start Session</button>
        <label style="display: none;">
          Session ID
          <input id="sessionId" type="text" readonly />
        </label>
        <label>
          Schema
          <select id="schemaSelect">
            <option value="">Loading schemas...</option>
          </select>
        </label>
        <label>
          Table
          <select id="tableSelect">
            <option value="">Loading tables...</option>
          </select>
        </label>
      </header>

      <div class="app-layout">
        <main id="chatBox" class="chat-box" aria-live="polite"></main>

        <aside id="adminSessionPanel" class="admin-session-panel" style="display: none;">
          <div class="admin-session-header">Active Sessions</div>
          <select id="sessionListSelect" class="session-list-select" style="display: none;"></select>
        </aside>
      </div>

      <footer class="composer">
        <textarea id="queryInput" rows="3" placeholder="Ask a question about the selected table..."></textarea>
        <button id="sendBtn" type="button">Send</button>
      </footer>
    </div>

    <script src="{{ url_for('static', path='sql-agent/config.js') }}"></script>
    <script src="{{ url_for('static', path='sql-agent/app.js') }}"></script>
  </body>
</html>
